# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "authnet-cli"

[setup]
script = '''
set -euo pipefail

cd "$CODEX_WORKTREE_PATH"

REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd -P)"

mkdir -p \
  "$REPO_ROOT/.cache/go-build" \
  "$REPO_ROOT/.cache/go-mod" \
  "$REPO_ROOT/.cache/go-tmp" \
  "$REPO_ROOT/.cache/golangci-lint" \
  "$REPO_ROOT/.cache/config" \
  "$REPO_ROOT/bin"

# Export for the current setup-script process.
# This matters because the commands below run immediately in this same shell.
export GOCACHE="$REPO_ROOT/.cache/go-build"
export GOMODCACHE="$REPO_ROOT/.cache/go-mod"
export GOTMPDIR="$REPO_ROOT/.cache/go-tmp"
export XDG_CACHE_HOME="$REPO_ROOT/.cache"
export GOLANGCI_LINT_CACHE="$REPO_ROOT/.cache/golangci-lint"
export AUTHNET_CONFIG_DIR="$REPO_ROOT/.cache/config"
export GOBIN="$REPO_ROOT/bin"
export PATH="$GOBIN:$PATH"

# Persist the environment for future interactive shells.
# This file is overwritten on each setup run so it always points at the
# current Codex worktree instead of accumulating stale blocks in ~/.bashrc.
CODEX_ENV_FILE="$HOME/.codex-authnet-cli-env"

cat > "$CODEX_ENV_FILE" <<EOF
# authnet-cli Codex environment
# Generated by .codex/environments/environment.toml setup script.

export GOCACHE="$REPO_ROOT/.cache/go-build"
export GOMODCACHE="$REPO_ROOT/.cache/go-mod"
export GOTMPDIR="$REPO_ROOT/.cache/go-tmp"
export XDG_CACHE_HOME="$REPO_ROOT/.cache"
export GOLANGCI_LINT_CACHE="$REPO_ROOT/.cache/golangci-lint"
export AUTHNET_CONFIG_DIR="$REPO_ROOT/.cache/config"
export GOBIN="$REPO_ROOT/bin"
export PATH="$REPO_ROOT/bin:\$PATH"
EOF

# Ensure ~/.bashrc sources the dedicated env file exactly once.
SOURCE_LINE="source \"$CODEX_ENV_FILE\""

touch "$HOME/.bashrc"

if ! grep -qxF "$SOURCE_LINE" "$HOME/.bashrc"; then
  {
    printf '\n'
    printf '# authnet-cli Codex environment\n'
    printf '%s\n' "$SOURCE_LINE"
  } >> "$HOME/.bashrc"
fi

go env GOCACHE GOMODCACHE GOTMPDIR GOBIN

go mod download

make golangci-lint-install
make install-git-hooks

go test ./...
'''

[cleanup]
script = '''
cd "$CODEX_WORKTREE_PATH"
rm -rf .cache bin
'''

[[actions]]
name = "Verify"
icon = "tool"
command = "make verify"

[[actions]]
name = "Test"
icon = "test"
command = "make test"

[[actions]]
name = "Lint"
icon = "tool"
command = "make golangci-lint-full"

[[actions]]
name = "Format"
icon = "tool"
command = "make fmt"

[[actions]]
name = "Build"
icon = "tool"
command = "make build"

[[actions]]
name = "CLI Help"
icon = "run"
command = "go run ./cmd/authnet --help"

[[actions]]
name = "Install Linter"
icon = "tool"
command = "make golangci-lint-install"

[[actions]]
name = "Install Git Hooks"
icon = "tool"
command = "make install-git-hooks"

[[actions]]
name = "Clean Local Artifacts"
icon = "tool"
command = '''
rm -rf .cache bin
rm -f /tmp/authnet
'''
